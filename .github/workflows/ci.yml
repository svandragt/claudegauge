name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: ccusage CLI surface check
        run: |
          set -euo pipefail
          npx ccusage --version
          npx ccusage blocks --help | grep -q -- '--active'
          npx ccusage blocks --help | grep -q -- '--token-limit'
          npx ccusage daily --help
